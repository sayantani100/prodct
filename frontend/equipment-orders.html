<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Orders</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .page { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }

        .login-bar {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 16px 20px;
        }
        .login-bar input {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px; padding: 8px 12px; color: #f3f4f6; font-size: 0.85rem; outline: none;
        }
        .login-bar button {
            background: linear-gradient(135deg, #6d28d9, #7c3aed); border: none; color: #fff;
            padding: 8px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }
        .login-bar .status { font-size: 0.85rem; color: #9ca3af; margin-left: auto; }
        .login-bar .status strong { color: #e5e7eb; }
        .login-bar .error { color: #fca5a5; font-size: 0.8rem; }

        h1 {
            font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em;
            background: linear-gradient(to right, #a855f7, #6366f1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .section-title {
            display: inline-block; background: linear-gradient(135deg, #6d28d9, #4c1d95);
            padding: 14px 28px; border-radius: 30px; font-size: 1.1rem; font-weight: 700; color: #fff;
        }

        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        @media (max-width: 900px) { .cards-grid { grid-template-columns: 1fr; } }

        .equip-card {
            border: 1px solid rgba(168,85,247,0.35); border-radius: 18px; padding: 24px;
            background: rgba(168,85,247,0.03); display: flex; flex-direction: column; gap: 14px;
        }
        .equip-card .label-pill {
            align-self: flex-start; background: linear-gradient(135deg, #6d28d9, #7c3aed);
            padding: 10px 24px; border-radius: 30px; font-weight: 700; font-size: 1.05rem;
        }
        .equip-card label { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.03em; }
        .equip-card input {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 8px 10px; color: #f3f4f6; font-size: 0.88rem; outline: none; margin-top: 3px;
        }
        .equip-card input:focus { border-color: rgba(168,85,247,0.5); }
        .equip-card .cost-row {
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; margin-top: 4px;
        }
        .create-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7); border: none; color: #fff;
            font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .create-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .equip-card .status-msg { font-size: 0.78rem; margin-top: 4px; }
        .equip-card .status-msg.ok { color: #86efac; }
        .equip-card .status-msg.err { color: #fca5a5; }

        .pressure-section {
            border-top: 6px solid rgba(255,255,255,0.06); padding-top: 30px;
        }
        .pressure-heading { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin: 16px 0 20px; }
        .pressure-heading h2 { font-size: 2rem; font-weight: 800; }
        .pressure-heading .note { color: #9ca3af; font-style: italic; }

        .pressure-form {
            border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 24px;
            max-width: 420px; display: flex; flex-direction: column; gap: 12px;
        }
        .pressure-form label { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.03em; }
        .pressure-form input {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 8px 10px; color: #f3f4f6; font-size: 0.88rem; outline: none; margin-top: 3px;
        }
        .pressure-form button {
            margin-top: 8px; background: linear-gradient(135deg, #6366f1, #a855f7); border: none;
            color: #fff; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;
        }
        .pressure-form .status-msg { font-size: 0.8rem; }
        .pressure-form .status-msg.ok { color: #86efac; }
        .pressure-form .status-msg.err { color: #fca5a5; }
    </style>
</head>
<body>
<div class="page">

    <div class="login-bar">
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Login</button>
        <span class="status" id="sessionStatus">Not signed in</span>
    </div>

    <div>
        <h1>Items listed and made</h1>
    </div>

    <div class="cards-grid" id="equipCards"></div>

    <div class="pressure-section">
        <span class="section-title">Pressure Change</span>
        <div class="pressure-heading">
            <h2>Cpap / Bipap</h2>
            <span class="note">(order already there)</span>
        </div>
        <div class="pressure-form" id="pressureForm">
            <div>
                <label>Related Order ID</label>
                <input type="text" id="pc_orderId" placeholder="e.g. 14">
            </div>
            <div><label>Type</label><input type="text" id="pc_type"></div>
            <div><label>Feature</label><input type="text" id="pc_feature"></div>
            <div><label>Adjust</label><input type="text" id="pc_adjust"></div>
            <div><label>Range</label><input type="text" id="pc_range"></div>
            <div><label>Company</label><input type="text" id="pc_company"></div>
            <div><label>Cost</label><input type="text" id="pc_cost"></div>
            <div><label>Pressure Setting</label><input type="text" id="pc_pressure"></div>
            <button id="pc_submitBtn">Apply Pressure Change</button>
            <div class="status-msg" id="pc_status"></div>
        </div>
    </div>

</div>

<script>
    const API_BASE = 'http://localhost:8080';
    let authToken = null;

    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const sessionStatus = document.getElementById('sessionStatus');

    loginBtn.addEventListener('click', async () => {
        const username = loginUsername.value.trim();
        const password = loginPassword.value;
        if (!username || !password) {
            sessionStatus.innerHTML = '<span class="error">Enter username and password.</span>';
            return;
        }
        try {
            const response = await fetch(`${API_BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (!response.ok) throw new Error(response.status === 401 ? 'Invalid credentials.' : `Login failed (${response.status}).`);
            const data = await response.json();
            authToken = data.token;
            sessionStatus.innerHTML = `Signed in as <strong>${escapeHtml(username)}</strong>`;
            loginPassword.value = '';
        } catch (error) {
            sessionStatus.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
        }
    });

    function authHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
        return headers;
    }

    const EQUIPMENT = [
        { key: 'CPAP', label: 'Cpap', defaultCost: '$1,000' },
        { key: 'BIPAP', label: 'Bipap', defaultCost: '$5,000' },
        { key: 'DME', label: 'DME', defaultCost: '$10,000' }
    ];

    const cardsContainer = document.getElementById('equipCards');
    cardsContainer.innerHTML = EQUIPMENT.map(eq => `
        <div class="equip-card" data-key="${eq.key}">
            <div class="label-pill">${eq.label}</div>
            <div><label>Type</label><input type="text" data-field="type"></div>
            <div><label>Feature</label><input type="text" data-field="featureFeature"></div>
            <div><label>Adjust</label><input type="text" data-field="adjustFeature"></div>
            <div><label>Range</label><input type="text" data-field="range"></div>
            <div><label>Company</label><input type="text" data-field="company"></div>
            <div><label>Pressure Setting</label><input type="text" data-field="pressureSetting"></div>
            <div class="cost-row">
                <input type="text" data-field="cost" value="${eq.defaultCost}" style="max-width:130px;font-size:1.1rem;font-weight:700;border:none;background:transparent;padding:0;">
                <button class="create-btn" data-create="${eq.key}">&#10132;</button>
            </div>
            <div class="status-msg" data-status="${eq.key}"></div>
        </div>
    `).join('');

    cardsContainer.querySelectorAll('[data-create]').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!authToken) {
                alert('Please sign in first.');
                return;
            }
            const key = btn.getAttribute('data-create');
            const card = cardsContainer.querySelector(`.equip-card[data-key="${key}"]`);
            const statusEl = card.querySelector(`[data-status="${key}"]`);
            const getField = (name) => card.querySelector(`[data-field="${name}"]`).value.trim();

            btn.disabled = true;
            statusEl.textContent = '';
            statusEl.className = 'status-msg';

            try {
                const response = await fetch(`${API_BASE}/api/equipment-orders/create`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({
                        equipmentType: key,
                        type: getField('type'),
                        featureFeature: getField('featureFeature'),
                        adjustFeature: getField('adjustFeature'),
                        range: getField('range'),
                        company: getField('company'),
                        cost: getField('cost'),
                        pressureSetting: getField('pressureSetting')
                    })
                });
                if (!response.ok) throw new Error(`Failed (${response.status})`);
                const order = await response.json();
                statusEl.textContent = `Order #${order.id} created — pending review.`;
                statusEl.className = 'status-msg ok';
            } catch (error) {
                statusEl.textContent = error.message;
                statusEl.className = 'status-msg err';
            } finally {
                btn.disabled = false;
            }
        });
    });

    document.getElementById('pc_submitBtn').addEventListener('click', async () => {
        if (!authToken) {
            alert('Please sign in first.');
            return;
        }
        const statusEl = document.getElementById('pc_status');
        const orderId = document.getElementById('pc_orderId').value.trim();
        if (!orderId) {
            statusEl.textContent = 'Related Order ID is required.';
            statusEl.className = 'status-msg err';
            return;
        }

        const val = (id) => document.getElementById(id).value.trim() || null;
        const btn = document.getElementById('pc_submitBtn');
        btn.disabled = true;
        statusEl.textContent = '';
        statusEl.className = 'status-msg';

        try {
            const response = await fetch(`${API_BASE}/api/equipment-orders/pressure-change`, {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({
                    relatedOrderId: Number(orderId),
                    type: val('pc_type'),
                    featureFeature: val('pc_feature'),
                    adjustFeature: val('pc_adjust'),
                    range: val('pc_range'),
                    company: val('pc_company'),
                    cost: val('pc_cost'),
                    pressureSetting: val('pc_pressure')
                })
            });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || `Failed (${response.status})`);
            }
            statusEl.textContent = `Order #${orderId} updated — pending re-review.`;
            statusEl.className = 'status-msg ok';
        } catch (error) {
            statusEl.textContent = error.message;
            statusEl.className = 'status-msg err';
        } finally {
            btn.disabled = false;
        }
    });

    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
</script>
</body>
</html>
